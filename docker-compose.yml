services:
  mongo:
    image: mongo:7
    volumes: [ mongo-data:/data/db ]

  rabbitmq:
    image: rabbitmq:3-management
    ports: [ "127.0.0.1:15672:15672" ]
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    volumes: [ sql-data:/var/opt/mssql ]

  user-service:
    build: { context: ., dockerfile: Dockerfile.user }
    # ports: [ "5298:8080" ]
    environment:
      ConnectionStrings__UserServiceDbConnection: "Server=sqlserver;Database=UsersDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      JWT__AudienceIP: forum-api
      JWT__IssuerIP: forum-auth
      JWT__SecretKey: ${JWT_SECRET}
      App__PublicBaseUrl: http://localhost:5238
      Email__Password: ${EMAIL_PASSWORD}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
    depends_on: [ sqlserver ]

  posts-service:
    build: { context: ., dockerfile: Dockerfile.posts }
    # ports: [ "5111:8080" ]
    environment:
      PostsAndCommentsDatabase__ConnectionString: mongodb://mongo:27017
      Services__Auth__BaseUrl: http://user-service:8080/
      JWT__AudienceIP: forum-api
      JWT__IssuerIP: forum-auth
      JWT__SecretKey: ${JWT_SECRET}
    depends_on: [ mongo, user-service ]

  votes-service:
    build: { context: ., dockerfile: Dockerfile.votes }
    # ports: [ "5221:8080" ]
    environment:
      VotesDatabase__ConnectionString: mongodb://mongo:27017
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: user
      RabbitMq__Password: ${RABBIT_PASSWORD}
      Services__Auth__BaseUrl: http://user-service:8080/
      Services__PostAndComment__BaseUrl: http://posts-service:8080/
      JWT__AudienceIP: forum-api
      JWT__IssuerIP: forum-auth
      JWT__SecretKey: ${JWT_SECRET}
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_started }
      posts-service: { condition: service_started }

  ranking-service:
    build: { context: ., dockerfile: Dockerfile.ranking }
    # ports: [ "5001:8080" ]
    environment:
      RankingDatabase__ConnectionString: mongodb://mongo:27017
      RabbitMq__Host: rabbitmq
      RabbitMq__VirtualHost: /
      RabbitMq__Username: user
      RabbitMq__Password: ${RABBIT_PASSWORD}
      Services__PostAndComment__BaseUrl: http://posts-service:8080/
      Services__Votes__BaseUrl: http://votes-service:8080/
    depends_on:
      rabbitmq: { condition: service_healthy }
      mongo: { condition: service_started }

  api-gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    ports: [ "5238:8080" ]
    environment:
      JWT__IssuerIP: forum-auth
      JWT__AudienceIP: forum-api
      JWT__SecretKey: ${JWT_SECRET}
      ReverseProxy__Clusters__votes-cluster__Destinations__d1__Address: http://votes-service:8080/
      ReverseProxy__Clusters__ranking-cluster__Destinations__d1__Address: http://ranking-service:8080/
      ReverseProxy__Clusters__posts-cluster__Destinations__d1__Address: http://posts-service:8080/
      ReverseProxy__Clusters__auth-cluster__Destinations__d1__Address: http://user-service:8080/
    depends_on: [ votes-service, ranking-service, posts-service, user-service ]

volumes:
  mongo-data:
  sql-data:
